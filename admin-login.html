<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk Admin — RTHub</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-overrides.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#f2f7f6}.login{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #cfdcdf;border-radius:16px;padding:32px;box-shadow:0 12px 35px #123b3512}.login .brand{padding:0 0 25px}.login h1{font:800 23px 'Plus Jakarta Sans';margin:0 0 8px}.login p{color:#8b97a6;font-size:12px}.field{display:block;margin:20px 0 0;font-size:11px;font-weight:bold}.field input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #d9e2e4;border-radius:7px}.login button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:8px;background:#0f766e;color:white;font-weight:bold}.forgot{display:block;text-align:center;margin-top:17px;color:#0f766e;font-size:11px}</style></head><body><main class="login"><div class="brand"><div class="brand-mark">R</div><div><strong>RT<span>Hub</span></strong><small>Sistem Iuran Warga</small></div></div><h1>Masuk ke panel admin</h1><p>Kelola iuran warga dengan lebih mudah dan transparan.</p><label class="field">EMAIL<input type="email" placeholder="nama@email.com"></label><label class="field">PASSWORD<input type="password" placeholder="Masukkan password"></label><button>Masuk ke Dashboard →</button><a class="forgot" href="#">Lupa password?</a></main></body></html>
